<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confirmação de Presença — Yasmim</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="estrelas"></div>

<main class="pagina">

<section class="card">

    <div class="monograma">Y</div>

    <p class="numero">15 ANOS</p>

    <h1>Yasmim</h1>

    <div class="linha"></div>

    <p class="frase">
        Uma noite iluminada por sonhos, marcada por memórias e cercada por pessoas especiais.
    </p>

    <p class="data">
        05 de dezembro • 20:00
    </p>

    <div class="divisor">
        <span>✦</span>
    </div>

    <h2>
        Confirme sua presença
    </h2>

    <p class="instrucao">
        Digite seu nome ou o nome da sua família para consultar seu convite.
    </p>

    <div class="campo-busca">

        <input
            type="text"
            id="convidado"
            placeholder="Digite seu nome"
            autocomplete="off"
        >

        <button
            type="button"
            id="botaoBuscar"
            onclick="buscarConvidado()"
        >
            Buscar
        </button>

    </div>

    <div id="mensagem"></div>

    <div id="resultado"></div>

    <p class="rodape">
        Será uma alegria ter você comigo nessa noite tão especial. 🩵
    </p>

</section>

</main>
