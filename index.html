<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de Presença — Yasmim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="estrelas"></div>

    <main class="pagina">

        <section class="card">

            <div class="monograma">Y</div>

            <p class="numero">15 ANOS</p>

            <h1>Yasmim</h1>

            <div class="linha"></div>

            <p class="frase">
                Uma noite iluminada por sonhos, marcada por memórias
                e cercada por pessoas especiais.
            </p>

            <p class="data">
                05 de dezembro • 20:00
            </p>

            <div class="divisor">
                <span>✦</span>
            </div>

            <h2>Confirme sua presença</h2>

            <p class="instrucao">
                Digite seu nome ou o nome da sua família para consultar seu convite.
            </p>

            <div class="campo-busca">

                <input
                    type="text"
                    id="convidado"
                    placeholder="Digite seu nome"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="botaoBuscar">
                    Buscar
                </button>

            </div>

            <div id="mensagem"></div>

            <div id="resultado"></div>

            <p class="rodape">
                Será uma alegria ter você comigo nessa noite tão especial. 🩵
            </p>

        </section>

    </main>


    <!-- PRIMEIRO CARREGA A LISTA -->
    <script src="convidados.js?v=100"></script>


    <!-- BUSCA -->
    <script>

        const campo = document.getElementById("convidado");
        const botao = document.getElementById("botaoBuscar");
        const mensagem = document.getElementById("mensagem");
        const resultado = document.getElementById("resultado");


        function normalizar(texto) {

            return String(texto)
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim();

        }


        function buscar() {

            const texto = campo.value.trim();

            mensagem.innerHTML = "";
            resultado.innerHTML = "";


            if (texto === "") {

                mensagem.innerHTML =
                    "<p>Digite seu nome para buscar.</p>";

                return;
            }


            if (
                typeof convidados === "undefined" ||
                !Array.isArray(convidados)
            ) {

                mensagem.innerHTML =
                    "<p>Erro ao carregar a lista de convidados.</p>";

                return;
            }


            const procura = normalizar(texto);


            const encontrados = convidados.filter(function(convite) {

                const familia =
                    normalizar(convite.familia || "");

                const pessoas =
                    Array.isArray(convite.pessoas)
                        ? convite.pessoas
                        : [];


                if (familia.includes(procura)) {
                    return true;
                }


                return pessoas.some(function(pessoa) {

                    return normalizar(pessoa)
                        .includes(procura);

                });

            });


            if (encontrados.length === 0) {

                mensagem.innerHTML =
                    "<p>Não encontramos esse nome na lista. Verifique a escrita e tente novamente.</p>";

                return;
            }


            encontrados.forEach(function(convite) {

                const caixa =
                    document.createElement("div");

                caixa.className =
                    "caixa-convite";


                const titulo =
                    document.createElement("h3");

                titulo.textContent =
                    convite.familia;


                caixa.appendChild(titulo);


                const texto =
                    document.createElement("p");

                texto.textContent =
                    "Pessoas deste convite:";


                caixa.appendChild(texto);


                const lista =
                    document.createElement("div");

                lista.className =
                    "lista-pessoas";


                convite.pessoas.forEach(function(pessoa, indice) {

                    const label =
                        document.createElement("label");

                    label.className =
                        "pessoa";


                    const checkbox =
                        document.createElement("input");

                    checkbox.type =
                        "checkbox";

                    checkbox.value =
                        pessoa;

                    checkbox.className =
                        "pessoa-checkbox";


                    const nome =
                        document.createElement("span");

                    nome.textContent =
                        pessoa;


                    label.appendChild(checkbox);

                    label.appendChild(nome);

                    lista.appendChild(label);

                });


                caixa.appendChild(lista);


                const confirmar =
                    document.createElement("button");

                confirmar.type =
                    "button";

                confirmar.className =
                    "botao-confirmar";

                confirmar.textContent =
                    "Confirmar presença";


                confirmar.addEventListener(
                    "click",
                    function() {

                        const selecionados =
                            Array.from(
                                caixa.querySelectorAll(
                                    ".pessoa-checkbox:checked"
                                )
                            ).map(function(checkbox) {
