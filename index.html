<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>Confirmação de Presença — Yasmim</title> <link rel="preconnect" href="https://fonts.googleapis.com" > <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin > <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" > <link rel="stylesheet" href="style.css?v=103" > </head> <body> <div class="estrelas"></div> <main class="pagina"> <section class="card"> <div class="monograma">Y</div> <p class="numero"> 15 ANOS </p> <h1> Yasmim </h1> <div class="linha"></div> <p class="frase"> Uma noite iluminada por sonhos, marcada por memórias e cercada por pessoas especiais. </p> <p class="data"> 05 de dezembro • 20:00 </p> <div class="divisor"> <span>✦</span> </div> <h2> Confirme sua presença </h2> <p class="instrucao"> Digite seu nome ou o nome da sua família para consultar seu convite. </p> <!-- BUSCA --> <div class="campo-busca"> <input type="text" id="convidado" placeholder="Digite seu nome" autocomplete="off" > <button type="button" id="botaoBuscar" > Buscar </button> </div> <div id="mensagem"></div> <div id="resultado"></div> <p class="rodape"> Será uma alegria ter você comigo nessa noite tão especial. 🩵 </p> </section> </main> <!-- ========================================== LISTA ========================================== --> <script src="convidados.js?v=103"></script> <!-- ========================================== BUSCA ========================================== --> <script> document.addEventListener( "DOMContentLoaded", function () { const campo = document.getElementById( "convidado" ); const botao = document.getElementById( "botaoBuscar" ); const mensagem = document.getElementById( "mensagem" ); const resultado = document.getElementById( "resultado" ); console.log( "Página carregada." ); function normalizar(texto) { return String(texto || "") .normalize("NFD") .replace( /[\u0300-\u036f]/g, "" ) .toLowerCase() .trim() .replace( /\s+/g, " " ); } function buscar() { const texto = campo.value.trim(); mensagem.innerHTML = ""; resultado.innerHTML = ""; if (!texto) { mensagem.innerHTML = "<p>Digite seu nome para buscar.</p>"; campo.focus(); return; } const lista = window.convidados; if ( !Array.isArray(lista) ) { mensagem.innerHTML = "<p>Erro ao carregar a lista de convidados.</p>"; console.error( "window.convidados não é uma lista." ); return; } console.log( "Buscando:", texto ); console.log( "Total de convidados:", lista.length ); const procura = normalizar(texto); const encontrados = lista.filter( function (convite) { const familia = normalizar( convite.familia ); const pessoas = Array.isArray( convite.pessoas ) ? convite.pessoas : []; return ( familia.includes( procura ) || pessoas.some( function (pessoa) { return normalizar( pessoa ).includes( procura ); } ) ); } ); if ( encontrados.length === 0 ) { mensagem.innerHTML = ` <p> Não encontramos esse nome na lista de convidados. </p> `; return; } mensagem.innerHTML = ` <p> Encontramos seu convite: </p> `; encontrados.forEach( function (convite) { const caixa = document.createElement( "div" ); caixa.className = "caixa-convite"; const titulo = document.createElement( "h3" ); titulo.textContent = convite.familia; caixa.appendChild( titulo ); const texto = document.createElement( "p" ); texto.textContent = "Selecione quem irá à festa:"; caixa.appendChild( texto ); const listaPessoas = document.createElement( "div" ); listaPessoas.className = "lista-pessoas"; convite.pessoas.forEach( function (pessoa) { const label = document.createElement( "label" ); label.className = "pessoa"; const checkbox = document.createElement( "input" ); checkbox.type = "checkbox"; checkbox.value = pessoa; checkbox.className = "pessoa-checkbox"; const nome = document.createElement( "span" ); nome.textContent = pessoa; label.appendChild( checkbox ); label.appendChild( nome ); listaPessoas.appendChild( label ); } ); caixa.appendChild( listaPessoas ); const confirmar = document.createElement( "button" ); confirmar.type = "button"; confirmar.className = "botao-confirmar"; confirmar.textContent = "Confirmar presença"; confirmar.addEventListener( "click", function () { const selecionados = Array.from( caixa.querySelectorAll( ".pessoa-checkbox:checked" ) ).map( function ( checkbox ) { return checkbox.value; } ); if ( selecionados.length === 0 ) { mensagem.innerHTML = "<p>Selecione pelo menos uma pessoa.</p>"; return; } console.log( "Família:", convite.familia ); console.log( "Selecionados:", selecionados ); mensagem.innerHTML = "<p>Presença selecionada com sucesso. 🩵</p>"; } ); caixa.appendChild( confirmar ); resultado.appendChild( caixa ); } ); } /* ====================================== CLIQUE ====================================== */ botao.addEventListener( "click", function () { buscar(); } ); /* ====================================== ENTER ====================================== */ campo.addEventListener( "keydown", function (event) { if ( event.key === "Enter" ) { event.preventDefault(); buscar(); } } ); console.log( "Botão encontrado:", !!botao ); console.log( "Campo encontrado:", !!campo ); console.log( "Lista encontrada:", Array.isArray( window.convidados ) ); } ); </script> </body> </html>
