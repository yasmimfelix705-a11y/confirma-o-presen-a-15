<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Confirmação de Presença — Yasmim</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"> <link rel="stylesheet" href="style.css"> </head> <body> <div class="estrelas"></div> <main class="pagina"> <section class="card"> <!-- MONOGRAMA --> <div class="monograma">Y</div> <p class="numero">15 ANOS</p> <h1>Yasmim</h1> <div class="linha"></div> <p class="frase"> Uma noite iluminada por sonhos, marcada por memórias e cercada por pessoas especiais. </p> <p class="data"> 05 de dezembro • 20:00 </p> <div class="divisor"> <span>✦</span> </div> <!-- TÍTULO --> <h2>Confirme sua presença</h2> <p class="instrucao"> Digite seu nome ou o nome da sua família para consultar seu convite. </p> <!-- CAMPO DE BUSCA --> <div class="campo-busca"> <input type="text" id="convidado" placeholder="Digite seu nome" autocomplete="off" autocapitalize="words" > <button type="button" id="botaoBuscar"> Buscar </button> </div> <!-- MENSAGEM --> <div id="mensagem"></div> <!-- RESULTADO DA BUSCA --> <div id="resultado"></div> <p class="rodape"> Será uma alegria ter você comigo nessa noite tão especial. 🩵 </p> </section> </main> <!-- ========================================== LISTA DE CONVIDADOS ========================================== --> <script src="convidados.js?v=101"></script> <!-- ========================================== SISTEMA DE BUSCA ========================================== --> <script> document.addEventListener("DOMContentLoaded", function () { const campo = document.getElementById("convidado"); const botao = document.getElementById("botaoBuscar"); const mensagem = document.getElementById("mensagem"); const resultado = document.getElementById("resultado"); /* ========================================== NORMALIZAR TEXTO Remove acentos e coloca tudo em minúsculo. ========================================== */ function normalizar(texto) { return String(texto || "") .toLowerCase() .normalize("NFD") .replace(/[\u0300-\u036f]/g, "") .trim(); } /* ========================================== BUSCAR CONVIDADO ========================================== */ function buscar() { const texto = campo.value.trim(); /* Limpa resultados anteriores */ mensagem.innerHTML = ""; resultado.innerHTML = ""; /* Campo vazio */ if (texto === "") { mensagem.innerHTML = "<p>Digite seu nome para buscar.</p>"; campo.focus(); return; } /* Verifica se convidados.js carregou */ if ( typeof convidados === "undefined" || !Array.isArray(convidados) ) { mensagem.innerHTML = "<p>Não foi possível carregar a lista de convidados.</p>"; console.error( "A variável 'convidados' não foi encontrada." ); return; } /* Texto pesquisado */ const procura = normalizar(texto); /* ========================================== FILTRA A LISTA ========================================== */ const encontrados = convidados.filter(function (convite) { const familia = normalizar(convite.familia); const pessoas = Array.isArray(convite.pessoas) ? convite.pessoas : []; /* Procura pelo nome da família */ if (familia.includes(procura)) { return true; } /* Procura pelo nome de qualquer pessoa */ return pessoas.some(function (pessoa) { return normalizar(pessoa) .includes(procura); }); }); /* ========================================== NENHUM RESULTADO ========================================== */ if (encontrados.length === 0) { mensagem.innerHTML = "<p>Não encontramos esse nome na lista. Verifique a escrita e tente novamente.</p>"; return; } /* ========================================== MOSTRAR RESULTADOS ========================================== */ mensagem.innerHTML = "<p>Encontramos seu convite:</p>"; encontrados.forEach(function (convite) { /* Caixa do convite */ const caixa = document.createElement("div"); caixa.className = "caixa-convite"; /* Nome da família */ const titulo = document.createElement("h3"); titulo.textContent = convite.familia || "Seu convite"; caixa.appendChild(titulo); /* Texto */ const textoPessoas = document.createElement("p"); textoPessoas.textContent = "Pessoas deste convite:"; caixa.appendChild(textoPessoas); /* Lista */ const lista = document.createElement("div"); lista.className = "lista-pessoas"; const pessoas = Array.isArray(convite.pessoas) ? convite.pessoas : []; pessoas.forEach(function (pessoa) { /* Label */ const label = document.createElement("label"); label.className = "pessoa"; /* Checkbox */ const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.value = pessoa; checkbox.className = "pessoa-checkbox"; /* Nome */ const nome = document.createElement("span"); nome.textContent = pessoa; label.appendChild(checkbox); label.appendChild(nome); lista.appendChild(label); }); caixa.appendChild(lista); /* ========================================== BOTÃO CONFIRMAR ========================================== */ const confirmar = document.createElement("button"); confirmar.type = "button"; confirmar.className = "botao-confirmar"; confirmar.textContent = "Confirmar presença"; confirmar.addEventListener( "click", function () { const selecionados = Array.from( caixa.querySelectorAll( ".pessoa-checkbox:checked" ) ).map(function (checkbox) { return checkbox.value; }); /* Nenhuma pessoa selecionada */ if (selecionados.length === 0) { mensagem.innerHTML = "<p>Selecione pelo menos uma pessoa para confirmar.</p>"; return; } /* Mostra seleção */ mensagem.innerHTML = "<p>Presença selecionada com sucesso.</p>"; console.log( "Família:", convite.familia ); console.log( "Pessoas selecionadas:", selecionados ); /* * Aqui ficará o envio para o Firebase. * * Por enquanto o sistema apenas * identifica corretamente as pessoas * selecionadas. */ } ); caixa.appendChild(confirmar); /* Coloca a caixa na página */ resultado.appendChild(caixa); }); } /* ========================================== CLIQUE NO BOTÃO BUSCAR ========================================== */ botao.addEventListener( "click", buscar ); /* ========================================== ENTER NO CAMPO ========================================== */ campo.addEventListener( "keydown", function (event) { if (event.key === "Enter") { event.preventDefault(); buscar(); } } ); }); </script> </body> </html>
