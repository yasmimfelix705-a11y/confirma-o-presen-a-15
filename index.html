<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de Presença — Yasmim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css?v=30">
</head>

<body>

<div class="estrelas"></div>

<main class="pagina">

    <section class="card">

        <div class="monograma">Y</div>

        <p class="numero">15 ANOS</p>

        <h1>Yasmim</h1>

        <div class="linha"></div>

        <p class="frase">
            Uma noite iluminada por sonhos, marcada por memórias
            e cercada por pessoas especiais.
        </p>

        <p class="data">
            05 de dezembro • 20:00
        </p>

        <div class="divisor">
            <span>✦</span>
        </div>

        <h2>Confirme sua presença</h2>

        <p class="instrucao">
            Digite seu nome ou o nome da sua família para consultar seu convite.
        </p>

        <div class="campo-busca">

            <input
                type="text"
                id="convidado"
                placeholder="Digite seu nome"
                autocomplete="off"
            >

            <button
                id="botaoBuscar"
                type="button"
            >
                Buscar
            </button>

        </div>

        <div id="mensagem"></div>

        <p class="rodape">
            Será uma alegria ter você comigo nessa noite tão especial. 🩵
        </p>

    </section>

</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<!-- LISTA DE CONVIDADOS -->

<script src="convidados.js?v=30"></script>

<script>
const campoBusca = document.getElementById("convidado");
const botaoBuscar = document.getElementById("botaoBuscar");
const mensagem = document.getElementById("mensagem");

let conviteAtual = null;
let pessoasSelecionadas = [];

function normalizar(texto) {
    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
}

botaoBuscar.addEventListener("click", buscarConvidado);

campoBusca.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        buscarConvidado();
    }
});

function buscarConvidado() {

    const texto = normalizar(campoBusca.value);

    if (!texto) {
        mensagem.innerHTML = `
            <div class="mensagem-erro">
                Digite seu nome para buscar.
            </div>
        `;
        return;
    }

    const resultados = convidados.filter(function(convite) {

        const familia = normalizar(convite.familia);

        const encontrouFamilia =
            familia.includes(texto);

        const encontrouPessoa =
            Array.isArray(convite.pessoas) &&
            convite.pessoas.some(function(pessoa) {
                return normalizar(pessoa).includes(texto);
            });

        return encontrouFamilia || encontrouPessoa;
    });

    console.log("Pesquisa:", texto);
    console.log("Resultados:", resultados);

    if (resultados.length === 0) {

        mensagem.innerHTML = `
            <div class="mensagem-erro">
                Não encontramos esse nome na lista.
            </div>
        `;

        return;
    }

    if (resultados.length === 1) {
        mostrarConvite(resultados[0]);
        return;
    }

    let html = `
        <div class="resultado-busca">
            <p>Encontramos mais de um convite:</p>
    `;

    resultados.forEach(function(convite, index) {

        html += `
            <button
                type="button"
                class="resultado-item"
                onclick="mostrarConvite(convidados[${convidados.indexOf(convite)}])"
            >
                ${convite.familia}
            </button>
        `;

    });

    html += `</div>`;

    mensagem.innerHTML = html;
}

function mostrarConvite(convite) {

    conviteAtual = convite;
    pessoasSelecionadas = [];

    let html = `
        <div class="convite-encontrado">

            <h3>${convite.familia}</h3>

            <p>
                Selecione quem irá ao aniversário:
            </p>

            <div class="lista-pessoas">
    `;

    convite.pessoas.forEach(function(pessoa, index) {

        html += `
            <label class="pessoa-item">

                <input
                    type="checkbox"
                    onchange="alterarPessoa(${index}, this.checked)"
                >

                <span class="quadradinho"></span>

                <span class="nome-pessoa">
                    ${pessoa}
                </span>

            </label>
        `;

    });

    html += `
            </div>

            <button
                type="button"
                class="botao-confirmar"
                onclick="confirmarPresenca()"
            >
                Confirmar presença
            </button>

        </div>
    `;

    mensagem.innerHTML = html;
}

function alterarPessoa(index, selecionado) {

    const pessoa = conviteAtual.pessoas[index];

    if (selecionado) {

        if (!pessoasSelecionadas.includes(pessoa)) {
            pessoasSelecionadas.push(pessoa);
        }

    } else {

        pessoasSelecionadas =
            pessoasSelecionadas.filter(function(nome) {
                return nome !== pessoa;
            });
    }

    console.log("Selecionados:", pessoasSelecionadas);
}

function confirmarPresenca() {

    if (pessoasSelecionadas.length === 0) {

        mensagem.innerHTML = `
            <div class="mensagem-erro">
                Selecione pelo menos uma pessoa.
            </div>
        `;

        return;
    }

    mensagem.innerHTML = `
        <div class="confirmacao-final">
            <div class="monograma-confirmacao">Y</div>

            <h3>Presença selecionada!</h3>

            <p>
                ${pessoasSelecionadas.join(", ")}
            </p>
        </div>
    `;
}
</script>
