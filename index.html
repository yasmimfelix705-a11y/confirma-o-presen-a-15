<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de Presença — Yasmim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css?v=20">
</head>

<body>

    <div class="estrelas"></div>

    <main class="pagina">

        <section class="card">

            <div class="monograma">Y</div>

            <p class="numero">15 ANOS</p>

            <h1>Yasmim</h1>

            <div class="linha"></div>

            <p class="frase">
                Uma noite iluminada por sonhos, marcada por memórias
                e cercada por pessoas especiais.
            </p>

            <p class="data">
                05 de dezembro • 20:00
            </p>

            <div class="divisor">
                <span>✦</span>
            </div>

            <h2>Confirme sua presença</h2>

            <p class="instrucao">
                Digite seu nome ou o nome da sua família para consultar seu convite.
            </p>

            <div class="campo-busca">

                <input
                    type="text"
                    id="convidado"
                    placeholder="Digite seu nome"
                    autocomplete="off"
                >

                <button
                    id="botaoBuscar"
                    type="button"
                >
                    Buscar
                </button>

            </div>

            <div id="mensagem"></div>

            <p class="rodape">
                Será uma alegria ter você comigo nessa noite tão especial. 🩵
            </p>

        </section>

    </main>


    <!-- ==========================================
         FIREBASE
    =========================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


    <!-- ==========================================
         LISTA DE CONVIDADOS
    =========================================== -->

    <script src="convidados.js?v=20"></script>


    <!-- ==========================================
         FUNCIONAMENTO DO SITE
    =========================================== -->

<script>
document.getElementById("botaoBuscar").addEventListener("click", function () {
    document.getElementById("mensagem").innerHTML =
        '<p style="color:#6b9fc0;">O botão está funcionando!</p>';
});
</script>

</body>

</html>
