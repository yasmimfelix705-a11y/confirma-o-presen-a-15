<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>Confirmação de Presença — Yasmim</title> <link rel="preconnect" href="https://fonts.googleapis.com" > <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin > <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" > <link rel="stylesheet" href="style.css?v=102" > </head> <body> <div class="estrelas"></div> <main class="pagina"> <section class="card"> <!-- ====================================== MONOGRAMA ======================================= --> <div class="monograma"> Y </div> <p class="numero"> 15 ANOS </p> <h1> Yasmim </h1> <div class="linha"></div> <p class="frase"> Uma noite iluminada por sonhos, marcada por memórias e cercada por pessoas especiais. </p> <p class="data"> 05 de dezembro • 20:00 </p> <div class="divisor"> <span>✦</span> </div> <!-- ====================================== TÍTULO ======================================= --> <h2> Confirme sua presença </h2> <p class="instrucao"> Digite seu nome ou o nome da sua família para consultar seu convite. </p> <!-- ====================================== CAMPO DE BUSCA ======================================= --> <div class="campo-busca"> <input type="text" id="convidado" placeholder="Digite seu nome" autocomplete="off" autocapitalize="words" > <button type="button" id="botaoBuscar" > Buscar </button> </div> <!-- ====================================== MENSAGEM ======================================= --> <div id="mensagem"></div> <!-- ====================================== RESULTADO ======================================= --> <div id="resultado"></div> <p class="rodape"> Será uma alegria ter você comigo nessa noite tão especial. 🩵 </p> </section> </main> <!-- ========================================== LISTA DE CONVIDADOS IMPORTANTE: convidados.js deve estar na mesma pasta deste index.html =========================================== --> <script src="convidados.js?v=102"></script> <!-- ========================================== SISTEMA DE BUSCA =========================================== --> <script> document.addEventListener( "DOMContentLoaded", function () { const campo = document.getElementById( "convidado" ); const botao = document.getElementById( "botaoBuscar" ); const mensagem = document.getElementById( "mensagem" ); const resultado = document.getElementById( "resultado" ); console.log( "Sistema de busca iniciado." ); /* ====================================== NORMALIZAR TEXTO ====================================== */ function normalizar(texto) { return String(texto || "") .normalize("NFD") .replace( /[\u0300-\u036f]/g, "" ) .toLowerCase() .trim() .replace( /\s+/g, " " ); } /* ====================================== MOSTRAR MENSAGEM ====================================== */ function mostrarMensagem(texto) { mensagem.innerHTML = `<p>${texto}</p>`; } /* ====================================== BUSCAR ====================================== */ function buscar() { console.log( "Botão Buscar clicado." ); // Limpa resultados anteriores mensagem.innerHTML = ""; resultado.innerHTML = ""; // Pega o texto const texto = campo.value.trim(); // Campo vazio if (texto === "") { mostrarMensagem( "Digite seu nome para buscar." ); campo.focus(); return; } // Verifica a lista if ( typeof convidados === "undefined" || !Array.isArray( convidados ) ) { mostrarMensagem( "Não foi possível carregar a lista de convidados." ); console.error( "ERRO: a variável convidados não foi encontrada." ); return; } console.log( "Lista carregada:", convidados.length ); // Normaliza pesquisa const procura = normalizar(texto); /* ================================== PROCURA ================================== */ const encontrados = convidados.filter( function (convite) { const familia = normalizar( convite.familia ); const pessoas = Array.isArray( convite.pessoas ) ? convite.pessoas : []; // Pesquisa na família const encontrouFamilia = familia.includes( procura ); // Pesquisa nas pessoas const encontrouPessoa = pessoas.some( function (pessoa) { return normalizar( pessoa ).includes( procura ); } ); return ( encontrouFamilia || encontrouPessoa ); } ); /* ================================== NÃO ENCONTROU ================================== */ if ( encontrados.length === 0 ) { mensagem.innerHTML = ` <p> Não encontramos esse nome na lista. </p> <p> Verifique a escrita e tente novamente. </p> `; return; } /* ================================== ENCONTROU ================================== */ mensagem.innerHTML = ` <p> Encontramos seu convite: </p> `; /* ================================== MOSTRAR CADA FAMÍLIA ================================== */ encontrados.forEach( function (convite) { // Caixa const caixa = document.createElement( "div" ); caixa.className = "caixa-convite"; // Título const titulo = document.createElement( "h3" ); titulo.textContent = convite.familia || "Seu convite"; caixa.appendChild( titulo ); // Texto const textoPessoas = document.createElement( "p" ); textoPessoas.textContent = "Selecione quem irá à festa:"; caixa.appendChild( textoPessoas ); // Lista const lista = document.createElement( "div" ); lista.className = "lista-pessoas"; const pessoas = Array.isArray( convite.pessoas ) ? convite.pessoas : []; /* ========================== PESSOAS =========================== */ pessoas.forEach( function (pessoa) { const label = document.createElement( "label" ); label.className = "pessoa"; const checkbox = document.createElement( "input" ); checkbox.type = "checkbox"; checkbox.value = pessoa; checkbox.className = "pessoa-checkbox"; const nome = document.createElement( "span" ); nome.textContent = pessoa; label.appendChild( checkbox ); label.appendChild( nome ); lista.appendChild( label ); } ); caixa.appendChild( lista ); /* ========================== BOTÃO CONFIRMAR =========================== */ const confirmar = document.createElement( "button" ); confirmar.type = "button"; confirmar.className = "botao-confirmar"; confirmar.textContent = "Confirmar presença"; confirmar.addEventListener( "click", function () { const selecionados = Array.from( caixa.querySelectorAll( ".pessoa-checkbox:checked" ) ).map( function ( checkbox ) { return checkbox.value; } ); /* ================== NENHUM SELECIONADO =================== */ if ( selecionados.length === 0 ) { mensagem.innerHTML = ` <p> Selecione pelo menos uma pessoa para confirmar. </p> `; return; } /* ================== CONSOLE =================== */ console.log( "Família:", convite.familia ); console.log( "Pessoas selecionadas:", selecionados ); /* ================== SUCESSO =================== */ mensagem.innerHTML = ` <p> Presença selecionada com sucesso. 🩵 </p> `; // Desativa o botão confirmar.disabled = true; confirmar.textContent = "Presença selecionada"; } ); caixa.appendChild( confirmar ); // Coloca na página resultado.appendChild( caixa ); } ); } /* ====================================== BOTÃO BUSCAR ====================================== */ if (botao) { botao.addEventListener( "click", function (event) { event.preventDefault(); buscar(); } ); } else { console.error( "ERRO: botão botaoBuscar não encontrado." ); } /* ====================================== ENTER ====================================== */ if (campo) { campo.addEventListener( "keydown", function (event) { if ( event.key === "Enter" ) { event.preventDefault(); buscar(); } } ); } else { console.error( "ERRO: campo convidado não encontrado." ); } /* ====================================== TESTE FINAL ====================================== */ console.log( "Campo encontrado:", !!campo ); console.log( "Botão encontrado:", !!botao ); console.log( "Lista disponível:", typeof convidados !== "undefined" ); } ); </script> </body> </html>
